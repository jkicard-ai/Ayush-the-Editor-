<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JK Editor - Online Photo Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">JK <span>Editor</span></div>
  <div class="actions">
    <button id="undo">↶ Undo</button>
    <button id="redo">↷ Redo</button>
    <button id="download" class="primary">⬇ Export</button>
  </div>
</header>

<main class="app">
  <aside class="sidebar">
    <label class="upload">
      <input id="imageInput" type="file" accept="image/*">
      <span>＋ Upload Image</span>
    </label>
    <button data-tool="text">T &nbsp; Add Text</button>
    <button data-tool="rect">▭ &nbsp; Rectangle</button>
    <button data-tool="circle">○ &nbsp; Circle</button>
    <button data-tool="line">／ &nbsp; Line</button>
    <button id="delete">🗑 Delete Selected</button>
    <hr>
    <div class="panel">
      <h3>Canvas</h3>
      <div class="row"><input id="canvasW" type="number" value="1200"><input id="canvasH" type="number" value="800"></div>
      <button id="resizeCanvas">Apply Size</button>
      <button id="clearCanvas">Clear Canvas</button>
    </div>
    <div class="panel">
      <h3>Selected Object</h3>
      <label>Opacity <input id="opacity" type="range" min="0" max="1" step=".01" value="1"></label>
      <label>Rotation <input id="rotation" type="range" min="-180" max="180" value="0"></label>
      <label>Color <input id="color" type="color" value="#111111"></label>
      <label>Font Size <input id="fontSize" type="number" value="50" min="8" max="300"></label>
      <button id="bringFront">Bring Front</button>
      <button id="sendBack">Send Back</button>
    </div>
    <div class="hint">Tip: Upload an image, then add text/shapes. Drag, resize and rotate objects on the canvas.</div>
  </aside>

  <section class="workspace">
    <div class="toolbar">
      <span id="status">Ready</span>
      <button id="zoomOut">−</button><span id="zoomValue">100%</span><button id="zoomIn">＋</button>
      <button id="fit">Fit</button>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="editorCanvas" width="1200" height="800"></canvas>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<script src="script.js"></script>
</body>
</html>
