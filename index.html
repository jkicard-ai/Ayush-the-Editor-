<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JK Photo Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1d1f24;color:#eee;font-family:Arial,sans-serif;overflow:hidden}
.top{height:54px;background:#111318;border-bottom:1px solid #30343c;display:flex;align-items:center;gap:8px;padding:8px 12px}
.logo{font-weight:800;font-size:18px;color:#fff;margin-right:12px}.logo span{color:#ff8a00}
button,input,select{font:inherit}.btn{background:#282c34;border:1px solid #3a3f48;color:#eee;border-radius:6px;padding:7px 10px;cursor:pointer}.btn:hover{background:#343943}
.workspace{height:calc(100vh - 54px);display:grid;grid-template-columns:64px 1fr 270px}
.tools{background:#15171c;border-right:1px solid #30343c;padding:8px;display:flex;flex-direction:column;gap:7px}.tool{width:46px;height:42px;padding:0;font-size:18px}
.main{position:relative;background:#24272d;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;background:#ddd;box-shadow:0 8px 30px #0008;max-width:90%;max-height:86%;overflow:hidden}
canvas{display:block;max-width:100%;max-height:100%}
.side{background:#17191e;border-left:1px solid #30343c;padding:12px;overflow:auto}.panel{border:1px solid #30343c;border-radius:8px;padding:10px;margin-bottom:10px;background:#1d2026}.panel h3{margin:0 0 9px;font-size:13px;color:#bbb;text-transform:uppercase}
.row{display:flex;gap:7px;align-items:center;margin:7px 0}.row>*{min-width:0}.row label{font-size:12px;color:#aaa;width:80px}.row input[type=range]{flex:1}.row input[type=color]{width:42px;height:30px;padding:0;border:0}.layers{display:flex;flex-direction:column;gap:6px}.layer{padding:8px;background:#292d35;border:1px solid #3a3f48;border-radius:5px;cursor:pointer;font-size:12px}.layer.active{outline:2px solid #ff8a00}
.help{position:absolute;left:10px;bottom:10px;background:#111b;color:#aaa;padding:6px 8px;border-radius:5px;font-size:11px}
@media(max-width:800px){.workspace{grid-template-columns:56px 1fr}.side{display:none}.tool{width:40px}}
</style>
</head>
<body>
<div class="top">
  <div class="logo">JK <span>Photo Editor</span></div>
  <button class="btn" id="newBtn">New</button>
  <label class="btn">Open<input id="file" type="file" accept="image/*" hidden></label>
  <button class="btn" id="download">Export PNG</button>
  <button class="btn" id="undo">↶</button><button class="btn" id="redo">↷</button>
</div>
<div class="workspace">
  <div class="tools">
    <button class="btn tool" data-tool="select" title="Select">⌖</button>
    <button class="btn tool" data-tool="brush" title="Brush">🖌</button>
    <button class="btn tool" data-tool="eraser" title="Eraser">⌫</button>
    <button class="btn tool" data-tool="text" title="Text">T</button>
    <button class="btn tool" data-tool="crop" title="Crop">▣</button>
    <button class="btn tool" data-tool="line" title="Line">╱</button>
    <button class="btn tool" data-tool="rect" title="Rectangle">□</button>
  </div>
  <main class="main">
    <div id="stage"><canvas id="canvas" width="1200" height="800"></canvas></div>
    <div class="help">Brush: drag • Text: click canvas • Mouse wheel: zoom</div>
  </main>
  <aside class="side">
    <div class="panel">
      <h3>Tool Options</h3>
      <div class="row"><label>Color</label><input id="color" type="color" value="#ff7a00"></div>
      <div class="row"><label>Size</label><input id="size" type="range" min="1" max="100" value="12"><output id="sizeOut">12</output></div>
      <div class="row"><label>Opacity</label><input id="opacity" type="range" min="0" max="100" value="100"><output id="opOut">100%</output></div>
      <div class="row"><label>Text</label><input id="text" value="JK Printer" style="width:150px"></div>
      <div class="row"><label>Font</label><select id="font"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Impact</option><option>Times New Roman</option></select></div>
    </div>
    <div class="panel">
      <h3>Adjust</h3>
      <div class="row"><label>Brightness</label><input id="bright" type="range" min="-100" max="100" value="0"></div>
      <div class="row"><label>Contrast</label><input id="contrast" type="range" min="-100" max="100" value="0"></div>
      <div class="row"><label>Grayscale</label><input id="gray" type="range" min="0" max="100" value="0"></div>
      <button class="btn" id="apply">Apply Adjustments</button>
    </div>
    <div class="panel">
      <h3>Layers</h3>
      <div class="layers" id="layers"></div>
      <button class="btn" id="addLayer" style="margin-top:8px;width:100%">+ Add Layer</button>
    </div>
  </aside>
</div>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
let tool='select',drawing=false,lastX=0,lastY=0, history=[],future=[], zoom=1, layers=[{name:'Background'}];
function snapshot(){history.push(c.toDataURL());if(history.length>30)history.shift();future=[]}
function restore(url){let im=new Image();im.onload=()=>{ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(im,0,0)};im.src=url}
function renderLayers(){let box=document.getElementById('layers');box.innerHTML='';layers.slice().reverse().forEach((l,i)=>{let d=document.createElement('div');d.className='layer'+(i===0?' active':'');d.textContent=l.name;box.appendChild(d)})}
function setTool(t){tool=t;document.querySelectorAll('.tool').forEach(b=>b.style.background=b.dataset.tool===t?'#4a2f12':'')}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
document.getElementById('size').oninput=e=>document.getElementById('sizeOut').value=e.target.value;
document.getElementById('opacity').oninput=e=>document.getElementById('opOut').value=e.target.value+'%';
document.getElementById('newBtn').onclick=()=>{snapshot();ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);layers=[{name:'Background'}];renderLayers()};
document.getElementById('addLayer').onclick=()=>{layers.push({name:'Layer '+layers.length});renderLayers()};
document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let im=new Image();im.onload=()=>{snapshot();let scale=Math.min(1200/im.width,800/im.height,1);c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);ctx.drawImage(im,0,0,c.width,c.height);layers=[{name:f.name}];renderLayers()};im.src=URL.createObjectURL(f)};
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
c.addEventListener('pointerdown',e=>{let p=pos(e);lastX=p.x;lastY=p.y;drawing=true;if(tool==='text'){snapshot();ctx.globalAlpha=+document.getElementById('opacity').value/100;ctx.fillStyle=document.getElementById('color').value;ctx.font=document.getElementById('size').value*2+'px '+document.getElementById('font').value;ctx.fillText(document.getElementById('text').value,p.x,p.y);ctx.globalAlpha=1;drawing=false}});
c.addEventListener('pointermove',e=>{if(!drawing)return;let p=pos(e);ctx.save();ctx.globalAlpha=+document.getElementById('opacity').value/100;ctx.strokeStyle=document.getElementById('color').value;ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=+document.getElementById('size').value;ctx.lineCap='round';
if(tool==='brush'||tool==='eraser'){ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke()}
if(tool==='line'){ctx.clearRect(0,0,c.width,c.height); /* simple line preview omitted */ ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke()}
ctx.restore();lastX=p.x;lastY=p.y});
c.addEventListener('pointerup',()=>{if(drawing){drawing=false;snapshot()}});
document.getElementById('download').onclick=()=>{let a=document.createElement('a');a.download='jk-photo-editor.png';a.href=c.toDataURL('image/png');a.click()};
document.getElementById('undo').onclick=()=>{if(history.length>1){future.push(history.pop());restore(history[history.length-1])}};
document.getElementById('redo').onclick=()=>{if(future.length){let u=future.pop();history.push(u);restore(u)}};
document.getElementById('apply').onclick=()=>{snapshot();let b=+document.getElementById('bright').value,co=+document.getElementById('contrast').value,g=+document.getElementById('gray').value;let im=ctx.getImageData(0,0,c.width,c.height),d=im.data, factor=(259*(co+255))/(255*(259-co));for(let i=0;i<d.length;i+=4){let r=d[i],gg=d[i+1],bb=d[i+2];r=factor*(r-128)+128+b;gg=factor*(gg-128)+128+b;bb=factor*(bb-128)+128+b;let avg=(r+gg+bb)/3;r=r*(1-g/100)+avg*g/100;gg=gg*(1-g/100)+avg*g/100;bb=bb*(1-g/100)+avg*g/100;d[i]=Math.max(0,Math.min(255,r));d[i+1]=Math.max(0,Math.min(255,gg));d[i+2]=Math.max(0,Math.min(255,bb))}ctx.putImageData(im,0,0)};
ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);snapshot();renderLayers();setTool('select');
</script>
</body></html>
